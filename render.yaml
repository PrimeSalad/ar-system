services:
  - type: web
    name: accomplish-pro
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build --workspace backend && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
